  </defs>
  <rect width="1200" height="1500" fill="url(#bg1)"/>
  <rect width="1200" height="1500" fill="url(#bg2)"/>
  <g fill="url(#fig)" opacity="0.42" filter="url(#soft)">
    <ellipse cx="600" cy="560" rx="168" ry="208"/>
